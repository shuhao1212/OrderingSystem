<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订餐系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 400px;">
        <h3 class="text-center mb-4">🍽️ 订餐系统登录</h3>
        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">角色</label>
                <select name="role" class="form-select">
                    <option value="顾客端">顾客端</option>
                    <option value="商家端">商家端</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input name="username" class="form-control" value="顾客" required>
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input name="password" type="password" class="form-control" value="123456" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">登录</button>
        </form>
        <p class="text-muted small text-center mt-3 mb-0">默认商家：商家 / 123456</p>
        <p class="text-center mt-1 mb-0">没有账号？<a href="/register">注册新顾客</a></p>
    </div>
</body>
</html>
